[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "probabilistic-unmixing-zero"
version = "0.1.0"
description = "Probabilistic spectral unmixing with uncertain concentrations and spectral knowledge."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]


[tool.setuptools.packages.find]
where = ["src"]
